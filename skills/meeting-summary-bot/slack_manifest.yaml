# Slack app manifest: api.slack.com/apps > Create New App > From an app manifest
display_information:
  name: Meeting Summary
  description: 미팅자료를 교수님 양식의 3줄 요약으로 정리합니다.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: meeting-summary
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - app_home_opened
      - message.im
  interactivity:
    is_enabled: true  # buttons ("새 주제예요" / "노트 없이 진행"); Socket Mode needs no URL
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
